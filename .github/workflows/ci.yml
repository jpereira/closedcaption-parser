# CI: build e testes em Linux (gcc/clang) e macOS, sanitizers, lint e install.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest, cc: clang }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Build
        run: make all example CC=${{ matrix.cc }}
        env:
          CFLAGS: -Werror
      - name: Test
        run: make test CC=${{ matrix.cc }}
        env:
          CFLAGS: -Werror
      - name: Install (DESTDIR) e pkg-config
        run: |
          make install PREFIX=/usr/local DESTDIR="$PWD/build/inst"
          test "$(PKG_CONFIG_PATH="$PWD/build/inst/usr/local/lib/pkgconfig" pkg-config --modversion libclosedcaption)" = "$(cat VERSION)"

  sanitize:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - run: make test-sanitize CC=clang

  fuzz:
    name: Fuzz (60s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - run: make fuzz CC=clang
      - run: |
          mkdir -p build/corpus
          build/fuzz-pes -max_total_time=60 build/corpus

  lint:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      - run: make lint
